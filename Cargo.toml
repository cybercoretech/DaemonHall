[package]
name = "daemonhall"
version = "0.1.0"
edition = "2024"
description = "DaemonHall — web control room for your own systemd services (Cybercore Tech)"
license = "MIT"
repository = "https://github.com/cybercoretech/DaemonHall"
default-run = "daemonhall"

[dependencies]
anyhow = "1.0"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync", "net", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
futures-util = "0.3"
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Shared CYBERGRID theme engine. Pin cyberwatch to an existing upstream
# revision so clean CI builds can resolve the Git dependency reproducibly.
cybercore = "0.8"
cyberwatch = { git = "https://github.com/cybercoretech/cyberwatch", rev = "769b92c8edc70357d87cc42fd0403d14f17196df" }

[profile.release]
strip = true
lto = "thin"
